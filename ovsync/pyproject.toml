[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ovsync"
version = "0.1.0"
description = "Download the signed OfflineVault catalogue into a Kiwix-ready folder."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "cryptography>=41"]

[project.scripts]
ovsync = "ovsync.cli:main"

[tool.setuptools.packages.find]
include = ["ovsync*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
