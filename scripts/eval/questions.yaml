        keys: ["2 tablespoon|1 tablespoon|1/2 teaspoon|1/4 teaspoon|half a teaspoon|quarter teaspoon", "lemon|citric acid", "quart|pint|jar"]
      - fact: "Crushed tomatoes: 35 minutes for pints, 45 for quarts in a boiling-water canner at 0 to 1,000 ft"
        keys: ["35 minute|45 minute", "pint|quart"]
      - fact: "Fill hot jars with 1/2 inch of headspace"
        keys: ["1/2 inch|half inch|half an inch", "headspace|head space"]
