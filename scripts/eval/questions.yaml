# OfflineVault accuracy eval. See README.md for how to add a question and rubric.md for how answers are scored.
# Every gold fact is traceable to the `sources` of its question: a Field Guide article (and the manual that article
# cites) or a catalogue entry (ZIM title). Nothing here comes from an author's memory.
version: 1

