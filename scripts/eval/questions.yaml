        cites: "Ensuring safe canned foods (USDA Guide 1), pp17-19; Wikipedia, Botulism, sections Signs and symptoms and Treatment"

  - id: food-tomatoes-acidify
    section: food
    coverage: fieldguide
    expect: answer
    question: "canning crushed tomatoes in a water bath, do i really need to add lemon juice? how long do they go for"
    gold:
