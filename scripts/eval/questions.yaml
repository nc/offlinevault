        cites: "Chicken or rabbit, meats, meat stock, chile con carne, clams, crab and fish with process tables (USDA Guide 5), pp135-142; Pressure canners and using them (USDA Guide 1), pp30-34"

  - id: food-jerky-campfire
    section: food
    coverage: fieldguide
    expect: answer
    question: "lots of venison and no freezer. how do i make jerky over a fire, what wood"
