title: "Emergency childbirth"
summary: When the baby is coming before help does; how to tell, how to set up, how to support the head and shoulders, cut the cord, deliver the placenta and watch the mother afterwards.
keywords: [emergency childbirth, labour, labor, delivery, crowning, umbilical cord, placenta, breech, postpartum bleeding, newborn]
procedure: |
  ### Is there time to travel?
  1. Call for help first. Then ask: is this her first baby (first labours take much longer)? Are contractions **less than 3 minutes apart**? Does she feel she has to move her bowels (the head is low)? Is there **crowning**, a bulge or the top of the head visible at the opening? Any of these means birth is minutes away; stay and prepare. Otherwise go.
  2. **Set up.** Do not let her go to the toilet; straining will deliver the baby there. Lie her on a sturdy bed or table with a folded sheet under her buttocks and a clean surface extending at least 60 cm (2 ft) beyond them, because newborns are very slippery. Remove clothing below the waist, knees bent and apart, drape her legs with clean towels. Wash your hands thoroughly and put on gloves if you have them. Gather clean towels and a blanket, a bulb syringe if there is one, clean scissors or a knife, and clean string, tape or cord clamps. Put nothing into the birth canal.
  ### The birth
  3. Stay calm and reassuring; it helps everyone. Let her rest between contractions and breathe deeply through an open mouth during them. In the pushing stage, she pushes with each contraction and you can gently support the skin between the vagina and anus with a clean towel. Do not try to hold back the natural process.
  4. **When the head appears, slow it down.** Rest a hand against the head so it emerges gradually rather than popping out. As the head comes, feel for the **cord around the neck**; slip it over the head or shoulder, and if it is too tight, tie or clamp it in two places 5 cm (2 inches) apart and cut between.
  5. Once the chin is out, support the head and clear the mouth, then the nose, with the bulb syringe (squeeze it before inserting). The baby turns naturally to face a thigh. The top shoulder comes with gentle downward guidance of the head, the lower shoulder with gentle upward guidance; **never pull on the head or neck**. Keep one hand under the head and the other supporting the body as it slides out.
  6. **The baby is born.** Suction mouth and nose again if breathing has not started, wipe the face, dry the baby completely, wrap it warmly and put it on the mother's chest or breast; skin contact and suckling help the uterus clamp down. Note the time. A baby that is not breathing after drying and rubbing its back needs infant CPR (see CPR and choking).
  7. **The cord:** there is no hurry. When pulsing stops, tie or clamp it 15 to 20 cm (6 to 8 inches) from the baby's navel and again 5 cm further along, cut between, and for safety put a second tie 2.5 cm (1 inch) closer to the navel with a square knot. Clean string or shoelaces work if boiled or at least clean.
  ### The placenta and the first hours
  8. The placenta usually delivers itself in 10 to 20 minutes, up to 30: the uterus rises, the cord lengthens and there is a gush of blood. **Do not pull on the cord**; pulling can turn the uterus inside out and cause fatal bleeding. Gentle massage of the lower abdomen helps. Wrap the placenta and keep it for the hospital to check.
  9. **Bleeding is the biggest danger in the first hour.** Feel for the uterus below the navel and massage it firmly until it is hard like a grapefruit; repeat whenever it softens. Keep the baby feeding. Check her pulse and the bleeding every 15 minutes for the first hour, then every 30 minutes for three hours. **Heavy bleeding:** lie her flat with legs raised, massage the uterus, pads over the vagina, treat for shock and get her to hospital urgently. In the following days, fever over 38 °C (100.4 °F), chills, lower belly pain or foul discharge mean infection and need antibiotics.
  ### When it goes wrong
  10. **Bottom or legs first (breech):** support the body as it comes, keep it at or below the level of the birth canal, never pull. If the head has not come within 3 minutes of the body, slide two fingers into the vagina to hold the wall away from the baby's face and open its mouth so it can breathe, and get help urgently. **A hand or foot alone:** hospital immediately. **Cord coming before the baby:** cover it with moist clean cloth, put her head down and hips up, and with a gloved hand hold the baby off the cord all the way to hospital. **Head out but shoulders stuck** (the head pulls back like a turtle): pull her thighs tightly up onto her belly while a helper presses down just above the pubic bone; never yank the head.
  > Read the Hospital Corpsman pages below while you wait; they are written for exactly this situation. The SOF text is for medics and includes procedures you should not attempt.
