title: "Canning fruit and tomatoes"
summary: Fruit is naturally acid enough for a boiling-water canner; tomatoes sit on the line and every jar must be acidified with lemon juice or citric acid, whichever canner you use.
keywords: [canning fruit, canning peaches, applesauce, canning tomatoes, boiling-water canner, lemon juice, citric acid, acidify]
procedure: |
  ### Fruit
  1. Fruit is **high-acid** and can be processed in a **boiling-water canner**, or in a pressure canner at low pressure for a short time. Syrup is for flavour, colour and shape only; it does not prevent spoilage, so you may pack fruit in water, apple juice or white grape juice instead. For a load of 9 pints, light syrup (20 percent sugar) is 5-3/4 cups water to 1-1/2 cups sugar; medium (30 percent) is 5-1/4 cups water to 2-1/4 cups sugar.
  2. **Peaches** (also apricots and nectarines): dip in boiling water 30 to 60 seconds, then cold water, slip the skins, halve and pit, and hold the fruit in an ascorbic acid solution so it does not brown. Hot pack (preferred; raw packs give poor quality): bring the fruit to a boil in syrup, water or juice, fill hot jars cut side down with **1/2 inch headspace**. Sliced apples: boil 5 minutes in syrup or water, hot pack only. Applesauce: cook until tender, sieve or leave chunky, reheat to a rolling boil, fill with 1/2 inch headspace. Berries: raw pack, shaking down gently, cover with hot syrup, juice or water.
  3. Boiling-water canner: fill it half way, preheat to 180 °F (82 °C) for hot packs, load the jars, add boiling water to 1 to 2 inches over the lids, cover and bring to a vigorous boil, then start the timer. If the boil stops, start the timing again. Times at 0 to 1,000 ft: peaches hot pack **20 minutes pints, 25 quarts** (raw 25 / 30); applesauce 15 / 20; whole berries hot pack 15 for pints or quarts; sliced apples 20. Higher altitudes need longer (peaches pints: 25 minutes at 1,001 to 3,000 ft, 30 at 3,001 to 6,000 ft, 35 above). Use the table for your fruit.
  4. Pressure canner option for peaches, apricots, nectarines, pears and plums: 10 minutes at 6 lb (dial gauge, 0 to 2,000 ft) or 5 lb (weighted gauge, 0 to 1,000 ft; 10 lb above that).
  ### Tomatoes
  5. **Acidify every jar**: 2 tablespoons of bottled lemon juice or 1/2 teaspoon of citric acid per quart; 1 tablespoon or 1/4 teaspoon per pint. Four tablespoons of 5 percent vinegar per quart also works but changes the flavour. Add it to the jar before filling. This is required **even when pressure canning**. Add a little sugar to offset the acid taste if you like.
  6. Use firm, disease-free, preferably vine-ripened fruit. **Do not can tomatoes from dead or frost-killed vines.** Green tomatoes are more acid than ripe ones and can be canned with the same recipes.
  7. Crushed tomatoes: dip, peel, core and quarter. Heat one sixth of them in a large pot, crushing to draw juice, then add the rest gradually, stirring, and boil gently 5 minutes. Fill hot jars with **1/2 inch headspace**, salt optional. Whole or halved in water: peel, cover with water, boil gently 5 minutes, fill with the hot liquid. Juice: cut and crush tomatoes straight into a boiling pot so it does not separate, simmer 5 minutes, sieve.
  8. Times at 0 to 1,000 ft in a boiling-water canner: crushed tomatoes **35 minutes pints, 45 quarts**; tomato juice 35 / 40. Pressure canner (pints or quarts): 15 minutes at 11 lb dial or 10 lb weighted, or 20 minutes at 6 lb dial or 5 lb weighted; above 1,000 ft a weighted gauge needs 15 lb or 10 lb respectively. USDA says pressure canning gives better quality tomatoes.
  9. Cool the jars 12 to 24 hours, test the seals, remove bands, label and store cool and dark.
  > Tomato sauces with meat, peppers, onions or other vegetables are a different recipe and most need a pressure canner. Use the USDA recipe for each.
