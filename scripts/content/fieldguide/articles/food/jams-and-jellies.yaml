title: "Jams and jellies"
summary: Sugar, acid and pectin set the fruit; boil to the jellying point or follow the pectin packet, fill sterile jars with 1/4 inch headspace, and give them 5 minutes in boiling water.
keywords: [jam, jelly, pectin, jellying point, sheet test, fruit preserves, marmalade, boiling-water canner]
procedure: |
  1. Jams and jellies are high-acid, high-sugar foods: process them in a **boiling-water canner for 5 minutes** at 0 to 1,000 ft (10 minutes at 1,001 to 6,000 ft, 15 above), in **pre-sterilised jars** with **1/4 inch headspace** and two-piece lids.
  2. **Jelly without added pectin** needs firm fruit naturally high in pectin (apples, crab apples, blackberries, grapes, plums) at about three quarters ripe and one quarter underripe. Commercial juice is too low in pectin. Crush soft fruit, cut firm fruit small (peels and cores add pectin), add water as the table says (1 cup per pound for apples and crab apples, simmer 20 to 25 minutes; none or 1/4 cup for berries and grapes, 5 to 10 minutes; 1/2 cup for plums, 15 to 20 minutes) and simmer until soft.
  3. Strain through a colander, then let the juice **drip** through a jelly bag or double cheesecloth. Squeezing makes cloudy jelly. A pound of fruit should give at least a cup of juice.
  4. Cook no more than 6 to 8 cups of juice at a time with **3/4 cup of sugar per cup of juice** (1 cup for crab apple; apple may take 1-1/2 teaspoons of lemon juice per cup). Boil hard to the jellying point. Thermometer: **220 °F at sea level**, about 2 °F lower for each 1,000 ft (216 °F at 2,000 ft, 212 °F at 4,000 ft, 209 °F at 6,000 ft, 205 °F at 8,000 ft). Spoon test: lift a cool metal spoon of the boiling syrup 12 inches above the pan and tip it; it is done when two drops run together and sheet off the edge.
  5. **Jam without added pectin**: fully ripe, washed, crushed fruit. Berries: 4 cups crushed fruit to 4 cups sugar. Peaches: 5-1/2 to 6 cups fruit, 4 to 5 cups sugar, 2 tablespoons lemon juice. Apricots: 4 to 4-1/2 cups, 4 cups sugar, 2 tablespoons lemon juice. Add the sugar, bring to a boil stirring constantly, and boil until it thickens, using the thermometer or the refrigerator test (a spoonful on a cold plate in the freezer for a few minutes should gel). Allow for thickening as it cools.
  6. **With added pectin** (powdered or liquid): follow the packet exactly, because the order of adding sugar and pectin depends on the type. It needs less cooking, gives a larger yield and needs no gel test, and commercial or frozen juice is fine. **Buy fresh pectin each year**; old pectin gives poor gels. Half a teaspoon of butter cuts foaming but can cause off-flavours in long storage.
  7. Take off the heat, skim the foam quickly, ladle through a wide funnel into hot sterile jars with 1/4 inch headspace, wipe rims, fit lids and process. Cool 12 to 24 hours, check the seals, label and store cool and dark.
  > Low-pectin fruit such as strawberries can be helped with a high-pectin fruit, citrus peel or packet pectin. A jam that stays runny can be remade; the USDA guide has a procedure for soft jellies.
