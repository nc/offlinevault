title: "Making a family communication plan"
summary: Decide now how you will reach each other and where you will meet when phones are down or you are apart.
keywords: [family emergency communication plan, out-of-state contact, meeting place, wallet card, text not call]
procedure: |
  1. Write down every household member's phone, email, school or workplace address and phone, plus doctors, insurers and the children's pick-up list. Put it on paper; phones die.
  2. Choose an **out-of-area contact** (another region or state). Local lines jam first; everyone checks in through that person. Make sure they have two ways to be reached.
  3. Agree **two meeting places**: one just outside the home for a fire, and one outside the neighbourhood (a relative's house, a library, a place of worship) for when you cannot get home. Pick a third further away in case the whole area is evacuated.
  4. Learn to **text rather than call** in an emergency; texts get through congested networks. Keep calls short, and register with safe-and-well services (for example the Red Cross) when asked.
  5. Give everyone a wallet card and put a copy on the fridge and in the go-bag. Ask the school and workplace how they will communicate and whether they shelter in place or release children.
  6. **Practise** twice a year, like a fire drill: everyone sends a text to the out-of-area contact and names the meeting places.
  7. Keep phones charged when storms are forecast, keep a car charger and a power bank, and have a battery or hand-crank radio for official instructions when mobile networks are down.
